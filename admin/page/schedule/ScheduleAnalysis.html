<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>日程统计分析 - Amoli私有云</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="format-detection" content="telephone=no">
	<link rel="stylesheet" href="../../layui/css/layui.css" media="all" />
	<link rel="stylesheet" href="../../css/public.css" media="all" />
	<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
	<style type="text/css">
		.stat-card {
			background: #fff;
			padding: 20px;
			border-radius: 2px;
			margin-bottom: 15px;
		}
		.stat-number {
			font-size: 36px;
			font-weight: bold;
			color: #1E9FFF;
			margin: 10px 0;
		}
		.stat-label {
			color: #999;
			font-size: 14px;
		}
		.chart-container {
			background: #fff;
			padding: 20px;
			border-radius: 2px;
			margin-bottom: 15px;
		}
		.chart-title {
			font-size: 16px;
			font-weight: bold;
			margin-bottom: 15px;
			padding-bottom: 10px;
			border-bottom: 1px solid #f0f0f0;
		}
		.chart-box {
			width: 100%;
			height: 400px;
		}
	</style>
</head>

<body class="childrenBody">
	<div class="layui-row layui-col-space15">
		<!-- 统计卡片 -->
		<div class="layui-col-md3">
			<div class="stat-card">
				<div class="stat-label">总日程数</div>
				<div class="stat-number" id="totalCount">0</div>
			</div>
		</div>
		<div class="layui-col-md3">
			<div class="stat-card">
				<div class="stat-label">已完成</div>
				<div class="stat-number" style="color: #5FB878;" id="completedCount">0</div>
			</div>
		</div>
		<div class="layui-col-md3">
			<div class="stat-card">
				<div class="stat-label">待完成</div>
				<div class="stat-number" style="color: #FFB800;" id="pendingCount">0</div>
			</div>
		</div>
		<div class="layui-col-md3">
			<div class="stat-card">
				<div class="stat-label">完成率</div>
				<div class="stat-number" style="color: #FF5722;" id="completionRate">0%</div>
			</div>
		</div>
	</div>

	<!-- 筛选器 -->
	<div class="layui-row">
		<div class="layui-col-md12">
			<div class="layui-card">
				<div class="layui-card-body">
					<div style="text-align: center; margin-bottom: 20px;">
						<button class="layui-btn layui-btn-sm filter-btn" data-filter="week">本周</button>
						<button class="layui-btn layui-btn-sm layui-btn-primary filter-btn" data-filter="month">本月</button>
						<button class="layui-btn layui-btn-sm layui-btn-primary filter-btn" data-filter="year">本年</button>
						<button class="layui-btn layui-btn-sm layui-btn-primary filter-btn" data-filter="all">全部</button>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 图表区域 -->
	<div class="layui-row layui-col-space15">
		<!-- 完成状态饼图 -->
		<div class="layui-col-md6">
			<div class="chart-container">
				<div class="chart-title">完成状态分布</div>
				<div id="statusChart" class="chart-box"></div>
			</div>
		</div>

		<!-- 优先级分布饼图 -->
		<div class="layui-col-md6">
			<div class="chart-container">
				<div class="chart-title">优先级分布</div>
				<div id="typeChart" class="chart-box"></div>
			</div>
		</div>
	</div>

	<div class="layui-row layui-col-space15">
		<!-- 完成趋势折线图 -->
		<div class="layui-col-md12">
			<div class="chart-container">
				<div class="chart-title">最近30天完成趋势</div>
				<div id="trendChart" class="chart-box" style="height: 350px;"></div>
			</div>
		</div>
	</div>

	<script type="text/javascript" src="../../layui/layui.js"></script>
	<script type="text/javascript" src="ScheduleAnalysis.js"></script>
</body>

</html>
