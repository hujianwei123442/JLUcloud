<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title>日程管理 - Amoli私有云</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="format-detection" content="telephone=no">
	<link rel="stylesheet" href="../../layui/css/layui.css" media="all" />
	<link rel="stylesheet" href="../../css/public.css" media="all" />
	<style type="text/css">
		.schedule-item {
			padding: 15px;
			margin-bottom: 10px;
			border-left: 4px solid #1E9FFF;
			background: #fff;
			border-radius: 2px;
		}
		.schedule-item.low {
			border-left-color: #909399;
		}
		.schedule-item.important {
			border-left-color: #FFB800;
		}
		.schedule-item.urgent {
			border-left-color: #FF5722;
		}
		.schedule-item.critical {
			border-left-color: #F56C6C;
			background: #FEF0F0;
		}
		.schedule-item.completed {
			opacity: 0.6;
		}
		.schedule-item.completed .schedule-title {
			text-decoration: line-through;
		}
		.schedule-title {
			font-size: 16px;
			font-weight: bold;
			margin-bottom: 8px;
		}
		.schedule-meta {
			color: #999;
			font-size: 12px;
			margin-top: 8px;
		}
		.filter-tabs {
			margin-bottom: 15px;
		}

		/* 简洁的圆圈+文字单选按钮样式 */
		.priority-radio {
			display: inline-flex;
			align-items: center;
			margin: 0 15px 0 0;
			cursor: pointer;
			font-size: 14px;
			user-select: none;
			padding: 4px 6px;
			border-radius: 4px;
			transition: background-color 0.2s ease;
			vertical-align: middle;
			line-height: 1.4;
		}

		.priority-radio:hover {
			background-color: #f0f9ff;
		}

		.priority-radio input[type="radio"] {
			display: none;
		}

		.priority-radio .radio-circle {
			display: inline-block;
			margin-right: 5px;
			font-size: 14px;
			color: #9ca3af;
			transition: color 0.2s ease;
			font-weight: bold;
			line-height: 1;
			vertical-align: middle;
		}

		.priority-radio input[type="radio"]:checked + .radio-circle {
			color: #1E9FFF;
		}

		.priority-radio:hover .radio-circle {
			color: #1E9FFF;
		}

		.priority-radio .radio-text {
			color: #374151;
			font-weight: 500;
			line-height: 1.4;
			vertical-align: middle;
		}

		.priority-radio input[type="radio"]:checked ~ .radio-text {
			color: #1E9FFF;
			font-weight: 600;
		}
	</style>
</head>

<body class="childrenBody">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md12">
			<div class="layui-card">
				<div class="layui-card-header">
					<span>日程管理</span>
					<button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" id="addSchedule">
						<i class="layui-icon">&#xe608;</i> 添加日程
					</button>
				</div>
				<div class="layui-card-body">
					<div class="filter-tabs">
						<button class="layui-btn layui-btn-sm filter-btn" data-filter="all">全部</button>
						<button class="layui-btn layui-btn-sm layui-btn-primary filter-btn" data-filter="today">今天</button>
						<button class="layui-btn layui-btn-sm layui-btn-primary filter-btn" data-filter="week">本周</button>
						<button class="layui-btn layui-btn-sm layui-btn-primary filter-btn" data-filter="month">本月</button>
					</div>
					<div id="scheduleList">
						<div class="layui-loading" style="text-align: center; padding: 50px;">
							<i class="layui-icon layui-icon-loading layui-anim layui-anim-rotate layui-anim-loop"></i>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

	<!-- 添加/编辑日程表单 -->
	<script type="text/html" id="scheduleForm">
		<form class="layui-form" lay-filter="scheduleForm" style="padding: 20px;">
			<input type="hidden" name="id" id="scheduleId">
			<div class="layui-form-item">
				<label class="layui-form-label">日程标题</label>
				<div class="layui-input-block">
					<input type="text" name="title" placeholder="请输入日程标题" class="layui-input" value="测试日程">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">日程内容</label>
				<div class="layui-input-block">
					<textarea name="content" placeholder="请输入日程内容" class="layui-textarea" rows="4"></textarea>
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">日期</label>
				<div class="layui-input-block">
					<input type="text" name="date" id="scheduleDate" placeholder="请选择日期" class="layui-input" value="2026-01-21">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">时间</label>
				<div class="layui-input-block">
					<input type="text" name="time" placeholder="例如：09:00" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">分配给</label>
				<div class="layui-input-block">
					<select name="assigned_to" lay-verify="required" id="assignedSelect">
						<option value="">请选择用户</option>
					</select>
				</div>
			</div>
			<div class="layui-form-item" style="margin-bottom: 15px;">
				<label class="layui-form-label" style="padding-top: 8px;">优先级</label>
				<div class="layui-input-block" style="padding-top: 8px;">
					<label class="priority-radio">
						<input type="radio" name="type" value="low" title="低优先级">
						<span class="radio-circle">○</span>
						<span class="radio-text">低优先级</span>
					</label>
					<label class="priority-radio">
						<input type="radio" name="type" value="normal" title="普通" checked>
						<span class="radio-circle">○</span>
						<span class="radio-text">普通</span>
					</label>
					<label class="priority-radio">
						<input type="radio" name="type" value="important" title="重要">
						<span class="radio-circle">○</span>
						<span class="radio-text">重要</span>
					</label>
					<label class="priority-radio">
						<input type="radio" name="type" value="urgent" title="紧急">
						<span class="radio-circle">○</span>
						<span class="radio-text">紧急</span>
					</label>
				</div>
			</div>
			<div class="layui-form-item" style="text-align: right;">
				<button type="button" class="layui-btn" id="submitBtn">确定</button>
				<button type="button" class="layui-btn layui-btn-primary" id="cancelSchedule">取消</button>
			</div>
		</form>
	</script>

	<script type="text/javascript" src="../../layui/layui.js"></script>
	<script type="text/javascript" src="Schedule.js"></script>
	<script type="text/javascript">
		// 测试4个优先级圆圈+文字单选按钮功能和最终对齐
		setTimeout(function() {
			console.log('=== 测试4个优先级圆圈+文字单选按钮功能和最终对齐 ===');

			// 检查表单项对齐
			var $formItems = $('.layui-form-item');
			$formItems.each(function(index) {
				var $label = $(this).find('.layui-form-label');
				var $inputBlock = $(this).find('.layui-input-block');
				if ($label.length && $inputBlock.length) {
					var labelText = $label.text().trim();
					var labelTop = $label.offset().top;
					var inputTop = $inputBlock.offset().top;
					var labelHeight = $label.outerHeight();
					var inputHeight = $inputBlock.outerHeight();
					console.log('表单项', index + 1, '(', labelText, '): 标签顶部:', labelTop, '输入顶部:', inputTop, '偏移差:', Math.abs(inputTop - labelTop), '标签高度:', labelHeight, '输入高度:', inputHeight);
				}
			});

			var $radios = $('input[name="type"]');
			console.log('找到单选按钮数量:', $radios.length);

			$radios.each(function(index) {
				var $radio = $(this);
				var $circle = $radio.next('.radio-circle');
				var $text = $circle.next('.radio-text');
				console.log('单选按钮', index + 1, ':', $radio.val(), '选中:', $radio.is(':checked'), '圆圈:', $circle.text());

				// 测试点击事件
				$radio.on('change.test', function() {
					var selectedValue = $(this).val();
					console.log('选中优先级:', selectedValue);

					// 检查视觉效果
					var $selectedCircle = $(this).next('.radio-circle');
					var $selectedText = $selectedCircle.next('.radio-text');
					setTimeout(function() {
						console.log('选中后圆圈符号:', $selectedCircle.text(), '颜色:', $selectedCircle.css('color'));
						console.log('选中后文字颜色:', $selectedText.css('color'));
					}, 10);
				});
			});

			// 测试label点击
			$('.priority-radio').on('click.test', function() {
				var $radio = $(this).find('input[type="radio"]');
				console.log('点击了label:', $radio.val());
			});

			console.log('4个优先级圆圈+文字单选按钮最终测试完成');
		}, 1000);
	</script>
</body>

</html>
