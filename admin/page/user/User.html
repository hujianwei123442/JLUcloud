<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>用户管理 - Amoli私有云</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="format-detection" content="telephone=no">
	<link rel="stylesheet" href="../../layui/css/layui.css" media="all" />
	<link rel="stylesheet" href="../../css/public.css" media="all" />
</head>

<body class="childrenBody">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md12">
			<div class="layui-card">
				<div class="layui-card-header">
					<span>用户管理</span>
					<button class="layui-btn layui-btn-sm layui-btn-normal" style="float: right;" id="addUser">
						<i class="layui-icon">&#xe608;</i> 添加用户
					</button>
				</div>
				<div class="layui-card-body">
					<table class="layui-hide" id="userTable" lay-filter="userTable"></table>
				</div>
			</div>
		</div>
	</div>

	<!-- 表格工具栏 -->
	<script type="text/html" id="userBar">
		<a class="layui-btn layui-btn-xs" lay-event="edit">编辑</a>
		<a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del">删除</a>
	</script>

	<!-- 用户表单 -->
	<script type="text/html" id="userForm">
		<form class="layui-form" style="padding: 20px;">
			<input type="hidden" name="userId" id="userId">
			<div class="layui-form-item">
				<label class="layui-form-label">用户名</label>
				<div class="layui-input-block">
					<input type="text" name="username" placeholder="请输入用户名" lay-verify="required" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">密码</label>
				<div class="layui-input-block">
					<input type="password" name="password" placeholder="请输入密码" lay-verify="required" class="layui-input">
				</div>
			</div>
			<div class="layui-form-item">
				<label class="layui-form-label">角色</label>
				<div class="layui-input-block">
					<select name="role" lay-verify="required">
						<option value="">请选择角色</option>
						<option value="user" selected>普通用户</option>
						<option value="admin">管理员</option>
					</select>
				</div>
			</div>
			<div class="layui-form-item" style="text-align: right;">
				<button class="layui-btn" lay-submit lay-filter="submitUser">确定</button>
				<button type="button" class="layui-btn layui-btn-primary" onclick="layer.closeAll()">取消</button>
			</div>
		</form>
	</script>

	<script type="text/javascript" src="../../layui/layui.js"></script>
	<script type="text/javascript" src="User.js"></script>
</body>
</html>
