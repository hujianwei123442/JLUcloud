<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<title>我的文件 - Amoli私有云</title>
	<meta name="renderer" content="webkit">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<link rel="stylesheet" href="../../layui/css/layui.css" media="all" />
	<link rel="stylesheet" href="../../css/public.css" media="all" />
</head>

<body class="childrenBody">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md12">
			<div class="layui-card">
				<div class="layui-card-header">
					<span>我的文件</span>
					<span style="float: right; color: #999; font-size: 12px;">
						<i class="layui-icon layui-icon-tips"></i> 这里显示其他人分配给你的文件
					</span>
				</div>
				<div class="layui-card-body">
					<table class="layui-hide" id="myFilesTable" lay-filter="myFilesTable"></table>
				</div>
			</div>
		</div>
	</div>

	<!-- 表格工具栏 -->
	<script type="text/html" id="myFilesBar">
		<a class="layui-btn layui-btn-xs layui-btn-normal" lay-event="view">查看</a>
		<a class="layui-btn layui-btn-xs layui-btn-warm" lay-event="download">下载</a>
	</script>

	<script type="text/javascript" src="../../layui/layui.js"></script>
	<script type="text/javascript" src="MyFiles.js"></script>
</body>
</html>
