<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>节点同步管理</title>
    <meta name="renderer" content="webkit">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="stylesheet" href="../../layui/css/layui.css" media="all" />
    <style>
        .node-card {
            margin-bottom: 15px;
            border: 1px solid #e6e6e6;
            border-radius: 5px;
            padding: 15px;
            background: #fff;
        }
        .node-card.online {
            border-left: 4px solid #5FB878;
        }
        .node-card.offline {
            border-left: 4px solid #FF5722;
        }
        .node-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sync-progress {
            margin-top: 10px;
        }
        .stat-card {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .stat-card h3 {
            margin: 0;
            font-size: 32px;
        }
        .stat-card p {
            margin: 5px 0 0 0;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="layui-fluid">
        <!-- 统计概览 -->
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md3">
                <div class="stat-card" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                    <h3 id="totalNodes">0</h3>
                    <p>总节点数</p>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="stat-card" style="background: linear-gradient(135deg, #5FB878 0%, #009688 100%);">
                    <h3 id="onlineNodes">0</h3>
                    <p>在线节点</p>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="stat-card" style="background: linear-gradient(135deg, #FFB800 0%, #FF5722 100%);">
                    <h3 id="syncingNodes">0</h3>
                    <p>同步中</p>
                </div>
            </div>
            <div class="layui-col-md3">
                <div class="stat-card" style="background: linear-gradient(135deg, #01AAED 0%, #1E9FFF 100%);">
                    <h3 id="lastSyncTime">未同步</h3>
                    <p>最后同步</p>
                </div>
            </div>
        </div>

        <!-- 节点管理 -->
        <div class="layui-row layui-col-space15" style="margin-top: 15px;">
            <div class="layui-col-md12">
                <div class="layui-card">
                    <div class="layui-card-header">
                        <button class="layui-btn layui-btn-sm" id="addNode">
                            <i class="layui-icon">&#xe654;</i> 添加节点
                        </button>
                        <button class="layui-btn layui-btn-sm layui-btn-normal" id="syncAll">
                            <i class="layui-icon">&#xe9c6;</i> 全部同步
                        </button>
                        <button class="layui-btn layui-btn-sm layui-btn-warm" id="autoSync">
                            <i class="layui-icon">&#xe60e;</i> 自动同步
                        </button>
                        <button class="layui-btn layui-btn-sm layui-btn-primary" id="refreshNodes">
                            <i class="layui-icon">&#xe669;</i> 刷新
                        </button>
                    </div>
                    <div class="layui-card-body">
                        <div id="nodeList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 同步设置 -->
        <div class="layui-row layui-col-space15" style="margin-top: 15px;">
            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">同步设置</div>
                    <div class="layui-card-body">
                        <form class="layui-form" lay-filter="syncSettings">
                            <div class="layui-form-item">
                                <label class="layui-form-label">同步内容</label>
                                <div class="layui-input-block">
                                    <input type="checkbox" name="sync_files" title="文件" checked>
                                    <input type="checkbox" name="sync_schedule" title="日程" checked>
                                    <input type="checkbox" name="sync_users" title="用户数据">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">同步间隔</label>
                                <div class="layui-input-block">
                                    <select name="sync_interval">
                                        <option value="5">5分钟</option>
                                        <option value="15" selected>15分钟</option>
                                        <option value="30">30分钟</option>
                                        <option value="60">1小时</option>
                                        <option value="180">3小时</option>
                                    </select>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <label class="layui-form-label">冲突处理</label>
                                <div class="layui-input-block">
                                    <select name="conflict_strategy">
                                        <option value="newer">保留最新</option>
                                        <option value="larger">保留较大</option>
                                        <option value="manual">手动处理</option>
                                    </select>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-input-block">
                                    <button class="layui-btn" lay-submit lay-filter="saveSyncSettings">保存设置</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="layui-col-md6">
                <div class="layui-card">
                    <div class="layui-card-header">同步日志</div>
                    <div class="layui-card-body" style="height: 300px; overflow-y: auto;">
                        <table class="layui-table" lay-size="sm">
                            <thead>
                                <tr>
                                    <th>时间</th>
                                    <th>节点</th>
                                    <th>状态</th>
                                    <th>详情</th>
                                </tr>
                            </thead>
                            <tbody id="syncLogs">
                                <tr><td colspan="4" class="layui-text-center">暂无日志</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../layui/layui.js"></script>
    <script src="NodeSync.js?v=20260310"></script>
</body>
</html>
