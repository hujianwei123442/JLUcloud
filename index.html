<!DOCTYPE html>
<html>

<head>
	<meta charset="utf-8">
	<title> - 简约而不简单的私有云</title>
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<link rel="shortcut icon" href="favicon.ico" />
	<link rel="stylesheet" href="static/css/bootstrap.min.css">
	<script src="https://at.alicdn.com/t/font_1186130_04lkv4r5pub2.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
	<script src="static/js/jquery.min.js"></script>
	<script src="static/js/bootstrap.min.js"></script>
	<script src="static/layer/layer.js"></script>
	<style type="text/css">
	.ico{width:18px}.size{width:100px}.time{width:140px}.icon{width:1em;height:1em;vertical-align:-0.15em;fill:currentColor;overflow:hidden;}.github{color:#fff;fill:currentColor;width:1.4rem;height:1.4rem;vertical-align:middle;margin-top:-3px}a:link{text-decoration:none}
	/* 滑块验证码 */
	.captcha{width:100%;height:100%;display:flex;align-items:center;justify-content:center}#embed-captcha{width:300px;margin:0 auto;margin-top:-50px}#embed-captcha:empty{display:none}#embed-captcha::after{color:gray;display:block;font-size:13px;margin-top:5px;content:'使用你的手，缓慢且准确的滑过去！'}.show{display:block}.hide{display:none}#notice{color:red}
	</style>
</head>

<body onhashchange="doHash()">
	<nav class="navbar navbar-expand-md bg-dark navbar-dark">
		<div class="container">
			<b><a class="navbar-brand" href="./"></a></b>
			<button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#collapsibleNavbar">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="collapsibleNavbar">
				<ul class="navbar-nav mr-auto">
					<li class="nav-item">
						<a class="nav-link" href="./">首页</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="Ajax.php?act=logout">退出</a>
					</li>
				</ul>

			</div>
		</div>
	</nav>
	<br>
	<div class="container">
		<!-- 搜索栏 -->
		<div class="row mb-3 mt-3">
			<div class="col-md-8">
				<div class="input-group">
					<input type="text" class="form-control" id="searchInput" placeholder="搜索文件名...">
					<div class="input-group-append">
						<button class="btn btn-primary" onclick="searchFiles()">
							<svg class="icon" style="width:16px;height:16px;vertical-align:middle" aria-hidden="true">
								<use xlink:href="#icon-search"></use>
							</svg>
							搜索
						</button>
						<button class="btn btn-secondary" onclick="clearSearch()">清除</button>
					</div>
				</div>
			</div>
			<div class="col-md-4 text-right">
				<button class="btn btn-info" onclick="showStorageStats()">
					<svg class="icon" style="width:16px;height:16px;vertical-align:middle" aria-hidden="true">
						<use xlink:href="#icon-chart"></use>
					</svg>
					存储统计
				</button>
			</div>
		</div>

		<ol class="breadcrumb">
			<a class="breadcrumb-item" href="javascript:;" onclick="getList()">首页</a>
			<span id="nav"></span>
		</ol>
		
		<!-- 批量操作栏 -->
		<div id="batchBar" style="display:none;margin-bottom:10px;">
			<button class="btn btn-sm btn-danger" onclick="batchDelete()">批量删除</button>
			<button class="btn btn-sm btn-success" onclick="batchDownload()">批量下载</button>
			<button class="btn btn-sm btn-secondary" onclick="cancelBatch()">取消选择</button>
			<span class="ml-2">已选择 <strong id="selectedCount">0</strong> 个文件</span>
		</div>

		<table class="table table-hover table-sm">
			<thead class="table-active">
				<th style="width:30px"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
				<th class="ico"></th>
				<th>Name</th>
				<th class="size text-right">Size</th>
				<th class="time text-center">Time</th>
				<th class="text-center" style="width:200px">操作</th>
			</thead>
			<tbody id="list">
				<th class="text-center" colspan="7">暂无数据</th>
			</tbody>
		</table>
	</div>
	<div class="footer">
		<p align="center">
			<span id='record'></span>
		</p>
	</div>
	<script src="static/js/tj.js"></script>
	<script src="static/js/gt.js"></script>
	<script src="static/js/main_enhanced.js?v=4.2.2"></script>
</body>

</html>
